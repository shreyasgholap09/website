services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: birthday
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
    ports:
      - "5432:5432"
    volumes:
      - birthday_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday -d birthday"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://birthday:birthday@db:5432/birthday"
    ports:
      - "8000:8000"

volumes:
  birthday_data:
